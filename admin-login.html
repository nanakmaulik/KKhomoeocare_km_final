<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dcotor Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e9eef5;
    font-family: "Inter", sans-serif;
}

.card-pro {
    width: 460px;
    padding: 40px 35px;
    border-radius: 22px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(16px);
    border: 1px solid #d4d9e2;
    box-shadow: 0 6px 22px rgba(0,0,0,0.07);
}

.card-pro h3 {
    font-weight: 700;
    font-size: 26px;
    text-align: center;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #6b7688;
    margin-bottom: 25px;
}

.form-control-pro {
    width: 100%;
    height: 50px;
    border-radius: 12px;
    border: 1.6px solid #cdd4df;
    background: #f7f9fc;
    padding-left: 14px;
}

.form-control-pro:focus {
    border-color: #2879ff;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(40,121,255,0.18);
}

.eye-btn {
    position: absolute;
    right: 14px;
    top: 14px;
    cursor: pointer;
}

.btn-pro {
    width: 100%;
    height: 52px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #2879ff, #1c5ec9);
    color: #fff;
    font-weight: 700;
    margin-top: 10px;
}

#msg {
    text-align: center;
    margin-top: 10px;
}
.signup-link {
    color: #2879ff;
    font-weight: 600;
    text-decoration: none;
    margin-left: 4px;
    transition: 0.3s;
}

.signup-link:hover {
    color: #1c5ec9;
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="card-pro">

    <h3>Doctor Login</h3>
    <p class="subtitle">Enter your credentials</p>

    <form id="loginForm">

        <label>Email</label>
        <input type="email" id="email" class="form-control-pro mb-3" required>

        <label>Password</label>
        <div style="position:relative;">
            <input type="password" id="password" class="form-control-pro mb-3" required>
            <span class="eye-btn" onclick="togglePassword()">👁️</span>
        </div>

        <p id="msg"></p>

        <button class="btn-pro" type="submit">Login</button>
        <div style="text-align:center; margin-top:20px; font-size:14px;">
  Don't have an account?
  <a href="admin_registration.html" class="signup-link">Create Account</a>
</div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const client = createClient(
    "https://vwvskyxthnwscelhxvma.supabase.co",
    "sb_publishable_qcwlJ1XOB6bgxv0uvAIOVQ_8U5edIux"
);

// 👁️ Toggle password
function togglePassword(){
    const field = document.getElementById("password");
    field.type = field.type === "password" ? "text" : "password";
}

// 🔥 LOGIN LOGIC
// 🔥 SUPABASE AUTH LOGIN LOGIC
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("msg");

    msg.textContent = "Checking...";
    msg.style.color = "#2879ff";

    const { data, error } = await client.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        msg.style.color = "red";
        msg.textContent = "Invalid email or password ❌";
        console.log(error);
        return;
    }

    msg.style.color = "green";
    msg.textContent = "Login Successful 🎉";

    setTimeout(()=>{
        window.location.href = "index.html";
    }, 700);
});
</script>

</body>
</html>
