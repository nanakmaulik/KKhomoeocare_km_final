    <script type="module">
    import { supabase } from "./js/supabase.js";
    
    const params = new URLSearchParams(window.location.search);
    const doctorId = params.get("doctor");
console.log("Doctor ID:", doctorId);
    let selectedDate = null;
    let selectedSlot = null;
    let doctorFees = 0;

    /* ELEMENTS */
    const doctorCard = document.getElementById("doctorCard");
    const dateContainer = document.getElementById("dateContainer");
    const slotContainer = document.getElementById("slotContainer");
    const feeBox = document.getElementById("feeBox");

    /* STEP 1 — LOAD DOCTOR DETAILS */

            .from("doctors")
            .select("*")
            .eq("id", doctorId)
            .single();

        doctorFees = Number(data.fees);
        console.log("Doctor Fees:", doctorFees);
        doctorCard.innerHTML = `
  <div class="doctor-header">

  </div>

  <div class="doctor-stats">

      </div>
  </div>

<div class="doctor-contact">
    <p>
      <i class="bi bi-envelope-fill"></i>
      <a href="https://mail.google.com/mail/?view=cm&fs=1&to=${data.email}"

  </div>
  <p>

</p>

  <div class="doctor-about">
      <h4>Doctor Documents</h4>

      <div class="d-flex gap-2 flex-wrap">
        ${
          data.degree
          ? `<a href="${data.degree}" target="_blank" class="btn btn-outline-primary btn-sm">
                View Degree Certificate
             </a>`
          : `<span class="text-danger fw-bold">Degree not uploaded</span>`
        }

        ${
          data.license
          ? `<a href="${data.license}" target="_blank" class="btn btn-outline-secondary btn-sm">
                View Medical License
             </a>`
          : `<span class="text-danger fw-bold">License not uploaded</span>`
        }
      </div>
  </div>

  <div class="doctor-about">
      <h4>About Doctor</h4>
      <p>${data.about || "This doctor is experienced in providing high-quality consultation and patient care."}</p>
  </div>

  <!-- REVIEW SECTION -->
  <div class="review-section">
      <h4>Patient Reviews</h4>

      <div id="reviewList">
          <p class="text-muted">Loading reviews...</p>
      </div>

      <hr>

      <h4>Write a Review</h4>

      <div class="review-form">
          <input type="text" id="reviewName" class="form-control mb-2" placeholder="Your Name">

          <select id="reviewRating" class="form-control mb-2">
              <option value="">Select Rating</option>
              <option value="5">⭐⭐⭐⭐⭐ (5)</option>
              <option value="4">⭐⭐⭐⭐ (4)</option>
              <option value="3">⭐⭐⭐ (3)</option>

              <option value="1">⭐ (1)</option>

         <button class="review-btn" id="reviewBtn">Submit Review</button>
      </div>

`;
       await loadSlots();
await fetchReviews();
    }
    document.addEventListener("click", function(e){
  if(e.target && e.target.id === "reviewBtn"){
    submitReview();
  }
});

    /* STEP 2 — LOAD SLOTS FOR THIS DOCTOR */
    async function loadSlots(){
console.log("loadSlots() function called");
        const { data: slots, error } = await supabase
            .from("slots")
            .select("*")
            .eq("doctor_id", doctorId);
            
console.log("Slots Data:", slots);
console.log("Slots Error:", error);
        if(error){
            dateContainer.innerHTML = "Error loading slots";
            return;
        }

        dateContainer.innerHTML = "";
        slotContainer.innerHTML = "";

        
       
       // GROUP SLOTS BY DATE (ONLY TODAY + FUTURE)
const groupedDates = {};

const today = new Date();
today.setHours(0,0,0,0);

const seenSlots = new Set();

slots.forEach(s => {

    const slotDate = new Date(s.slot_date);
    slotDate.setHours(0,0,0,0);

    // Skip past dates automatically
    if (slotDate < today) return;

    // Duplicate check: same doctor + same date + same time
    const uniqueKey = `${s.doctor_id}_${s.slot_date}_${s.slot_time}`;

    if (seenSlots.has(uniqueKey)) return;

    seenSlots.add(uniqueKey);

    if (!groupedDates[s.slot_date]) groupedDates[s.slot_date] = [];
    groupedDates[s.slot_date].push(s);
});

// ✅ If no future slots exist
if(Object.keys(groupedDates).length === 0){
    dateContainer.innerHTML = "<p class='text-danger'>No future slots available</p>";
    slotContainer.innerHTML = "";
    return;
}

      // CREATE DATE BUTTONS (SORTED)
const sortedDates = Object.keys(groupedDates)
  .sort((a, b) => new Date(a) - new Date(b));

sortedDates.forEach((date, index) => {

    dateContainer.innerHTML += `
    <button class="date-btn ${index===0?'active':''}" data-date="${date}">
        ${formatDate(date)}
    </button>
    `;

    if(index===0) selectedDate = date;
});

// LOAD FIRST DATE SLOTS
loadTimeSlots(groupedDates[selectedDate]);

// DATE CLICK EVENTS
document.querySelectorAll(".date-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        document.querySelectorAll(".date-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");

        selectedDate = btn.dataset.date;
        loadTimeSlots(groupedDates[selectedDate]);
    });
});
}
        
    /* STEP 3 — LOAD TIME SLOTS */
    function loadTimeSlots(slots){

    slotContainer.innerHTML = "";
    selectedSlot = null;

    const now = new Date();
     // ✅ Pehle time ke hisaab se sort karo
     slots.sort((a, b) => {
        const [aH, aM] = a.slot_time.split(":").map(Number);
        const [bH, bM] = b.slot_time.split(":").map(Number);
        return (aH * 60 + aM) - (bH * 60 + bM);
    });

    slots.forEach(slot => {

        // slot date
        const slotDateObj = new Date(selectedDate);
        slotDateObj.setHours(0,0,0,0);

        // today date
        const todayObj = new Date();
        todayObj.setHours(0,0,0,0);

        // slot time split
        const [hours, minutes] = slot.slot_time.split(":").map(Number);

        // full slot datetime
        const slotDateTime = new Date(selectedDate);
        slotDateTime.setHours(hours, minutes, 0, 0);

        // ❌ अगर date आज की है और time निकल चुका है तो skip
        if(slotDateObj.getTime() === todayObj.getTime() && slotDateTime < now){
            return;
        }

        let div = document.createElement("div");
        div.textContent = slot.slot_time;
        div.dataset.slotId = slot.id;

        // If slot already booked → disable it
        if(slot.is_booked){
            div.classList.add("time-slot", "disabled-slot");
            div.style.background = "#ddd";
            div.style.color = "#888";
            div.style.cursor = "not-allowed";
            div.style.border = "1px solid #ccc";
        } 
        else {
            div.classList.add("time-slot");

            div.onclick = ()=>{
                document.querySelectorAll(".time-slot").forEach(s=>s.classList.remove("active"));
                div.classList.add("active");
                selectedSlot = slot.id;
            };
        }

        slotContainer.appendChild(div);

    });

    // अगर सारे slots निकल चुके हैं
    if(slotContainer.innerHTML.trim() === ""){
        slotContainer.innerHTML = `
  <div class="no-slot-msg">
    <i class="bi bi-exclamation-triangle-fill"></i>
    No available time slots
  </div>
`;
    }
}
    /* FORMAT DATE LIKE "12 Mar" */
    function formatDate(dateStr){
        const d = new Date(dateStr);
        return d.toLocaleDateString("en-GB",{ day:"2-digit", month:"short" });
    }

    
    /* FETCHING REVIEWS */
    async function fetchReviews() {
  const reviewList = document.getElementById("reviewList");

  const { data, error } = await supabase
    .from("doctor_reviews")
    .select("*")
    .eq("doctor_id", doctorId)
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    reviewList.innerHTML = `<p class="text-danger">Error loading reviews</p>`;
    return;
  }

  if (!data || data.length === 0) {
    reviewList.innerHTML = `<p class="text-muted">No reviews yet. Be the first one!</p>`;
    return;
  }

  reviewList.innerHTML = "";

  data.forEach((review) => {
    const stars = "⭐".repeat(review.rating);

   reviewList.innerHTML += `
  <div class="review-card">
    <h6>
      ${review.patient_name}
      <span class="review-stars">${stars}</span>
    </h6>
    <p>${review.review_text}</p>

    async function bookAppointment() {
         // 🔒 LOGIN CHECK (yahi lagana hai)
  const { data: { session } } = await supabase.auth.getSession();

if (!session) {
    alert("Please login or register to book appointment");
    window.location.href = "signin.html";
    return;
}
  console.log("API CALL STARTED");

  const patientname = document.getElementById("patientName").value.trim();
  const email = document.getElementById("patientEmail").value.trim();
  const phone = document.getElementById("patientPhone").value.trim();
  const appointmentType = document.querySelector('input[name="appointmentType"]:checked').value;
  const loggedInEmail = session.user.email.toLowerCase();
const enteredEmail = email.toLowerCase();

if (enteredEmail !== loggedInEmail) {
    alert("Please use your registered login email to book appointment.");
    return;
}

  if (!patientname || !email || !phone) {
    alert("Please fill patient details");
    return;
  }

  if (!selectedSlot) {
    alert("Please select a slot");
    return;
  }

  const activeSlot = document.querySelector(".time-slot.active");
  if (!activeSlot) {
    alert("Please select a valid slot");
    return;
  }

  const appointmentdate = selectedDate;
  const appointmenttime = activeSlot.textContent.trim();

  const apiUrl =
  appointmentType === "online"
    ? "https://kkhomoeocare-km-final-1.onrender.com/book-online-appointment"
    : "https://kkhomoeocare-km-final-1.onrender.com/book-offline-appointment";

      try {
  const response = await fetch(apiUrl, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      patientname,
      email,
      phone,
      appointmentdate,
      appointmenttime,
      doctor_id: doctorId,
      slot_id: selectedSlot
    })
  });

  const rawText = await response.text();
  console.log("RAW RESPONSE STATUS:", response.status);
  console.log("RAW RESPONSE BODY:", rawText);

  if (!response.ok) {
    throw new Error(`HTTP ${response.status} - ${rawText}`);
  }

  const data = JSON.parse(rawText);
  console.log("SERVER RESPONSE:", data);

  if (data.success) {
    if (data.meetLink) {
  alert("✅ Online Appointment Confirmed!\nMeet Link: " + data.meetLink);
} else if (data.meet_link) {
  alert("✅ Online Appointment Confirmed!\nMeet Link: " + data.meet_link);
} else {
  alert("✅ Offline Appointment Confirmed!");
}

    window.location.href = "appointmentsuccess.html";
  } else {
    alert(data.message || "Error booking appointment");
  }
} catch (error) {
  console.error("BOOKING ERROR:", error);
  alert("Server error / Booking API not working");
}
}
