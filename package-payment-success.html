<!DOCTYPE html>
<html>
<head>
  <title>Package Payment Success | MediSphere</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 600px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    .success {
      color: #198754;
      font-weight: 800;
    }

    .btn-home {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      background: #0066ff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="box">
  <h2 id="title">Confirming your package payment...</h2>
  <p id="message">Please wait while we confirm your payment.</p>
  <div id="actions"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const order_id = params.get("order_id");

  async function verifyPackagePayment() {
    if (!order_id) {
      document.getElementById("title").innerText = "Payment Error";
      document.getElementById("message").innerText = "Order ID missing.";
      return;
    }

    try {
      const response = await fetch("https://kkhomoeocare-km-final-1.onrender.com/verify-package-payment", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ order_id })
      });

      const data = await response.json();

      console.log("VERIFY PACKAGE PAYMENT RESPONSE:", data);

      if (data.success) {
        document.getElementById("title").innerText = "Payment Successful ✅";
        document.getElementById("title").classList.add("success");
        document.getElementById("message").innerText =
          "Your package payment has been confirmed. Confirmation email has been sent.";

        document.getElementById("actions").innerHTML = `
          <a class="btn-home" href="index.html">Back to Website</a>
          <a class="btn-home" href="price.html">View Packages</a>
        `;
      } else {
        document.getElementById("title").innerText = "Payment Verification Failed";
        document.getElementById("message").innerText =
          data.message || "Please contact support.";
      }

    } catch (err) {
      console.error(err);
      document.getElementById("title").innerText = "Server Error";
      document.getElementById("message").innerText =
        "Could not verify payment. Please contact support.";
    }
  }

  verifyPackagePayment();
</script>

</body>
</html>
