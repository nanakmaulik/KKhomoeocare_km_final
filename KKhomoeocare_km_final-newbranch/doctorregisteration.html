<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Registration | Medisphere</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #005ad3;
        }
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; }
        input, textarea, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        textarea { resize: vertical; }

        .btn {
            width: 100%;
            background: #005ad3;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        .success {
            display: none;
            margin-top: 15px;
            background: #4caf50;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Doctor Registration</h2>

    <form id="doctorForm">

        <!-- Row 1 -->
        <div class="row">
            <div class="col">
                <label>Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="col">
                <label>Phone Number</label>
                <input type="text" id="phone" required>
            </div>
        </div>

        <!-- Row 2 -->
        <div class="row">
            <div class="col">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="col">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
        </div>

        <!-- Row 3 -->
        <div class="row">
            <div class="col">
                <label>Profile Photo</label>
                <input type="file" id="profilePhoto" accept="image/*">
            </div>

            <div class="col">
                <label>Specialization</label>
                <input type="text" id="specialization">
            </div>
        </div>

        <!-- Row 4 -->
        <div class="row">
            <div class="col">
                <label>Education</label>
                <input type="text" id="education">
            </div>

            <div class="col">
                <label>Experience (Years)</label>
                <input type="number" id="experience">
            </div>
        </div>

        <!-- Row 5 -->
        <div class="row">
            <div class="col">
                <label>Consultation Fees (₹)</label>
                <input type="number" id="fees">
            </div>

            <div class="col">
                <label>Medical License Number</label>
                <input type="text" id="licenseNumber">
            </div>
        </div>

        <!-- Row 6 -->
        <div class="row">
            <div class="col">
                <label>Upload Degree Certificates</label>
                <input type="file" id="certificates" multiple>
            </div>

            <div class="col">
                <label>Upload Medical License</label>
                <input type="file" id="licenseFile">
            </div>
        </div>

        <!-- Row 7 -->
        <div class="row">
            <div class="col">
                <label>About Doctor</label>
                <textarea rows="3" id="about"></textarea>
            </div>

            <div class="col">
                <label>Status</label>
                <select id="status" onchange="toggleEmployment()">
                    <option value="unemployed">Unemployed</option>
                    <option value="employed">Employed</option>
                </select>
            </div>
        </div>

        <!-- Employment Details -->
        <div id="employmentDetails" style="display:none;">
            <div class="row">
                <div class="col">
                    <label>Working At</label>
                    <select id="workingAt">
                        <option value="clinic">Own Clinic</option>
                        <option value="hospital">Hospital</option>
                    </select>
                </div>

                <div class="col">
                    <label>Clinic/Hospital Name</label>
                    <input type="text" id="placeName">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Full Address</label>
                    <textarea rows="2" id="address"></textarea>
                </div>
            </div>
        </div>

        <button class="btn" type="submit">Register</button>
    </form>

    <div id="successMessage" class="success">Doctor Registered Successfully!</div>
</div>

<!-- SUPABASE JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
function toggleEmployment() {
    document.getElementById("employmentDetails").style.display =
        document.getElementById("status").value === "employed" ? "block" : "none";
}

const SUPABASE_URL = "https://vwvskyxthnwscelhxvma.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3dnNreXh0aG53c2NlbGh4dm1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1Njk4MjQsImV4cCI6MjA4NzE0NTgyNH0.uwcDR2hTCy_17nCn4i_B7pe3L8LsdQd8pjupJpkxl9g";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------------- UPLOAD FILE FUNCTION ----------------
async function uploadFile(bucketName, file) {
    if (!file) return null;

    const fileName = Date.now() + "_" + file.name;

    const { data, error } = await client.storage
        .from(bucketName)
        .upload(fileName, file);

    if (error) {
        console.log("Upload error:", error);
        return null;
    }

    // Get Public URL
    const { data: publicUrl } = client.storage
        .from(bucketName)
        .getPublicUrl(fileName);

    return publicUrl.publicUrl;
}

// ---------------- FORM SUBMIT ----------------
document.getElementById("doctorForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    // basic fields
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const specialization = document.getElementById("specialization").value;
    const education = document.getElementById("education").value;
    const experience = document.getElementById("experience").value;
    const fees = document.getElementById("fees").value;
    const about = document.getElementById("about").value;
    const licenseNumber = document.getElementById("licenseNumber").value;

    // employment
    const employed = document.getElementById("status").value === "employed";
    const workingAt = employed ? document.getElementById("workingAt").value : null;
    const placeName = employed ? document.getElementById("placeName").value : null;
    const address = employed ? document.getElementById("address").value : null;

    // files
    const profilePhoto = document.getElementById("profilePhoto").files[0];
    const certificateFiles = document.getElementById("certificates").files;
    const licenseFile = document.getElementById("licenseFile").files[0];

    // ---------------- UPLOADS ----------------
    let profilePhotoUrl = await uploadFile("doctor-profile", profilePhoto);

    let certificateUrls = [];
    for (let i = 0; i < certificateFiles.length; i++) {
        let uploaded = await uploadFile("doctor-certificates", certificateFiles[i]);
        if (uploaded) certificateUrls.push(uploaded);
    }

    let licenseFileUrl = await uploadFile("doctor-license", licenseFile);

    // ---------------- INSERT INTO SUPABASE ----------------
    const { data, error } = await client.from("doctor_registration").insert([{
        name,
        phone,
        email,
        password,
        specialization,
        education,
        experience,
        fees,
        about,
        license_number: licenseNumber,
        employed,
        working_at: workingAt,
        place_name: placeName,
        address,

        profile_photo: profilePhotoUrl,
        certificates: certificateUrls,
        license_file: licenseFileUrl
    }]);

    if (error) {
        alert("Error: " + error.message);
        console.log(error);
        return;
    }

    document.getElementById("successMessage").style.display = "block";
});
</script>
</script>

</body>
</html>
